<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="topbar-links" aria-label="Google apps">
        <a href="#">Gmail</a>
        <a href="#">Im&aacute;genes</a>
      </nav>

      <!-- Google's real "waffle" icon is a 3x3 dot grid - Lucide has no exact match, this is the closest stand-in. -->
      <button
        class="apps-btn"
        type="button"
        aria-label="Aplicaciones de Google"
      >
        <img src="assets/icons/grid-3x3.svg" width="20" height="20" alt="" />
      </button>

      <!-- Placeholder avatar - swap for a real profile photo whenever you like. -->
      <img
        class="avatar"
        src="assets/img/avatar.png"
        width="32"
        height="32"
        alt="Foto de perfil del usuario"
      />
    </header>

    <main class="search-main">
      <h1 class="logo" aria-label="Google">
        <span class="l-blue">G</span><span class="l-red">o</span
        ><span class="l-yellow">o</span><span class="l-blue">g</span
        ><span class="l-green">l</span><span class="l-red">e</span>
      </h1>

      <form class="search-form" role="search" action="#">
        <img
          class="search-icon"
          src="assets/icons/search.svg"
          width="18"
          height="18"
          alt=""
          aria-hidden="true"
        />
        <input
          type="text"
          name="q"
          aria-label="Buscar con Google"
          autocomplete="off"
          autofocus
        />
        <!-- Simplified single-color stand-in for Google Lens' multicolor camera icon. -->
        <img
          class="camera-icon"
          src="assets/icons/camera.svg"
          width="20"
          height="20"
          alt="Buscar por imagen"
        />
      </form>

      <div class="search-actions">
        <button type="button">Buscar con Google</button>
        <button type="button">Voy a tener suerte</button>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-region">Colombia</div>

      <nav class="footer-links" aria-label="Enlaces de Google">
        <a href="#">Sobre Google</a>
        <a href="#">Publicidad</a>
        <a href="#">Negocios</a>
        <a href="#">Cómo funciona la Búsqueda</a>
        <a href="#">Privacidad</a>
        <a href="#">Condiciones</a>
        <a href="#">Preferencias</a>
      </nav>
    </footer>
  </body>
</html>
