<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agency</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- Page background peeks around the white card, matching the mockup's floating-card look. -->
    <div class="page-shell">
      <div class="agency-card">
        <!-- Three-column grid keeps the logo perfectly centered regardless of the nav/button widths. -->
        <header class="site-header">
          <nav class="main-nav" aria-label="Primary">
            <a class="nav-link" href="#">
              Works
              <img
                class="chevron"
                src="assets/icons/chevron-down.svg"
                width="12"
                height="12"
                alt=""
              />
            </a>
            <a class="nav-link" href="#">Pricing</a>
            <a class="nav-link" href="#">About us</a>
          </nav>

          <a class="logo-badge" href="#" aria-label="Agency home">
            <!-- Custom brand mark, not from Lucide. -->
            <img
              src="assets/icons/logo-leaf.svg"
              width="100"
              height="100"
              alt=""
            />
          </a>

          <a class="btn-primary" href="#">Get App</a>
        </header>

        <section class="hero">
          <!-- Illustration from blush.design, per the assignment's suggested source. -->
          <img
            class="hero-figure hero-figure--left"
            src="assets/img/illustration-left.png"
            width="206"
            height="351"
            alt="Illustration of a person jumping while dollar coins circle above them"
          />

          <div class="hero-copy">
            <h1>Simple design, prototyping and collaboration</h1>
            <p>
              Purchase products separately or get them all by Pro Access saving
              a lot
            </p>

            <div class="store-buttons">
              <a class="store-btn" href="#">
                <!-- Simplified Apple mark - not a Lucide icon, Lucide doesn't cover brand logos. -->
                <img
                  src="assets/icons/apple.svg"
                  width="18"
                  height="18"
                  alt=""
                />
                <span>available on<strong>App Store</strong></span>
              </a>
              <a class="store-btn" href="#">
                <!-- Simplified Google Play triangle - single color, not the real multicolor mark. -->
                <img
                  src="assets/icons/google-play.svg"
                  width="16"
                  height="16"
                  alt=""
                />
                <span>available on<strong>Google Play</strong></span>
              </a>
            </div>
          </div>

          <!-- Illustration from blush.design, per the assignment's suggested source. -->
          <img
            class="hero-figure hero-figure--right"
            src="assets/img/illustration-right.png"
            width="240"
            height="330"
            alt="Illustration of a person leaning sideways with a paper airplane and mail icon nearby"
          />
        </section>

        <!-- Approximated logotypes, not the real brand assets. -->
        <section class="brands" aria-label="Trusted by">
          <span class="brand-logo">Google</span>
          <span class="brand-logo brand-logo--spaced">UBER</span>
          <span class="brand-logo brand-logo--script">stripe</span>
          <img
            class="brand-logo brand-icon"
            src="assets/icons/nike.svg"
            width="60"
            height="60"
            alt="Nike"
          />
          <span class="brand-logo">Mashable</span>
          <span class="brand-logo brand-logo--icon">
            <img src="assets/icons/airbnb.svg" width="18" height="18" alt="" />
            airbnb
          </span>
        </section>
      </div>
    </div>
  </body>
</html>
